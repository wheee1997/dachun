<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>庫存統計</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;background:#f5f6f8;color:#1f2937;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif
    }
    .wrap{max-width:820px;margin:0 auto;padding:18px 14px 50px}
    h1{margin:4px 0 16px;font-size:28px}
    h2{margin:0 0 12px;font-size:19px}
    .card{
      background:#fff;border:1px solid #e5e7eb;border-radius:16px;
      padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.04)
    }
    .item{
      display:grid;grid-template-columns:110px 1fr 70px;
      gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eef0f2
    }
    .item:last-child{border-bottom:0}
    .name{font-weight:700}
    .inputs{display:flex;gap:8px;flex-wrap:wrap}
    .slot{display:flex;align-items:center;gap:5px}
    .slot span{font-size:12px;color:#6b7280;white-space:nowrap}
    input[type="number"],input[type="text"]{
      height:42px;border:1px solid #cfd4dc;border-radius:10px;
      padding:7px 9px;font-size:16px;background:#fff
    }
    input[type="number"]{width:82px}
    input:focus{outline:2px solid #bfdbfe;border-color:#2563eb}
    .total{text-align:right;font-weight:800;font-size:20px}
    .total small{display:block;color:#6b7280;font-size:11px;font-weight:500}
    .temp-row{
      display:grid;grid-template-columns:1fr 105px;gap:10px;
      align-items:center;padding:9px 0
    }
    .temp-input{display:flex;align-items:center;gap:5px}
    .temp-input input{width:78px}
    button{
      border:0;border-radius:11px;min-height:42px;padding:9px 13px;
      font-size:14px;font-weight:700;cursor:pointer
    }
    .primary{background:#2563eb;color:#fff}
    .secondary{background:#eef2f7;color:#374151}
    .danger{background:#fef2f2;color:#b91c1c}
    .success{background:#ecfdf5;color:#047857}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .msg{margin-top:9px;min-height:18px;color:#047857;font-size:13px}
    .note{color:#6b7280;font-size:12px;margin-top:7px}
    details summary{cursor:pointer;font-weight:800;font-size:17px}
    .config{margin-top:14px}
    .config-item{
      border:1px solid #e5e7eb;border-radius:13px;padding:12px;margin-bottom:10px;background:#fafafa
    }
    .config-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .config-top input{flex:1;min-width:0}
    .loc-list{display:flex;flex-direction:column;gap:7px}
    .loc-row{display:flex;gap:7px;align-items:center}
    .loc-row input{flex:1;min-width:0}
    .fridge-config{display:flex;gap:8px;margin-bottom:8px}
    .fridge-config input{flex:1;min-width:0}
    .small{font-size:12px;padding:7px 10px;min-height:36px}
    @media(max-width:620px){
      h1{font-size:24px}
      .item{grid-template-columns:1fr 70px}
      .inputs{grid-column:1/-1}
      .slot{flex:1 1 115px}
      .slot input{width:100%}
      .config-top{align-items:stretch}
      .config-top,.loc-row,.fridge-config{flex-wrap:wrap}
      .config-top input,.loc-row input,.fridge-config input{flex:1 1 180px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1 id="pageTitle">庫存統計</h1>

  <section class="card">
    <h2>商品庫存</h2>
    <div id="inventory"></div>
  </section>

  <section class="card">
    <h2>冰箱溫度</h2>
    <div id="fridges"></div>
  </section>

  <section class="card">
    <div class="actions">
      <button class="primary" id="copyBtn">複製文字</button>
      <button class="secondary" id="clearValuesBtn">清除數量</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="note">庫存數字、溫度與自訂設定都只會保存在這台裝置的瀏覽器。</div>
  </section>

  <section class="card">
    <details>
      <summary>編輯品項與位置名稱</summary>
      <div class="config">
        <div class="note" style="margin-bottom:10px">
          可直接改品項名稱、位置名稱（例如「小冰箱」「後冰箱」），也可以增加或刪除位置與品項。
        </div>

        <div style="margin-bottom:12px">
          <label style="font-weight:700">網頁標題</label><br>
          <input type="text" id="titleInput" style="width:100%;margin-top:6px">
        </div>

        <div id="configItems"></div>

        <div class="actions" style="margin:10px 0 18px">
          <button class="success" id="addItemBtn">＋ 新增品項</button>
        </div>

        <h2 style="font-size:16px">冰箱名稱</h2>
        <div id="fridgeConfig"></div>
        <div class="actions" style="margin-bottom:16px">
          <button class="success small" id="addFridgeBtn">＋ 新增冰箱</button>
        </div>

        <div class="actions">
          <button class="primary" id="saveConfigBtn">套用設定</button>
          <button class="danger" id="resetConfigBtn">恢復預設設定</button>
        </div>
      </div>
    </details>
  </section>
</div>

<script>
const DEFAULT_CONFIG = {
  title: "庫存統計",
  items: [
    {name:"豆花", locations:["位置1","位置2"]},
    {name:"豆漿", locations:["位置1","位置2"]},
    {name:"三色", locations:["位置1"]},
    {name:"牛奶", locations:["位置1","位置2"]},
    {name:"布丁", locations:["位置1","位置2"]},
    {name:"糖水", locations:["位置1","位置2"]},
    {name:"愛玉", locations:["位置1"]},
    {name:"杏仁豆腐", locations:["位置1","位置2","位置3"]},
    {name:"杏仁茶", locations:["位置1","位置2"]},
    {name:"粉粿", locations:["位置1","位置2"]}
  ],
  fridges:[
    "前面三色冷藏冰箱",
    "前面冷凍小冰箱",
    "後面水冰箱"
  ]
};

const CONFIG_KEY = "inventory_custom_config_v2";
const VALUES_KEY = "inventory_custom_values_v2";

let config = loadConfig();

function deepCopy(obj){ return JSON.parse(JSON.stringify(obj)); }

function loadConfig(){
  try{
    const raw=localStorage.getItem(CONFIG_KEY);
    return raw ? JSON.parse(raw) : deepCopy(DEFAULT_CONFIG);
  }catch(e){ return deepCopy(DEFAULT_CONFIG); }
}

function saveConfigStorage(){
  localStorage.setItem(CONFIG_KEY,JSON.stringify(config));
}

function safeNum(v){
  const n=Number(v);
  return Number.isFinite(n)?n:0;
}

function buildMain(){
  document.getElementById("pageTitle").textContent=config.title || "庫存統計";
  document.title=config.title || "庫存統計";

  const inventory=document.getElementById("inventory");
  inventory.innerHTML="";

  config.items.forEach((item,i)=>{
    const row=document.createElement("div");
    row.className="item";

    const name=document.createElement("div");
    name.className="name";
    name.textContent=item.name;

    const inputs=document.createElement("div");
    inputs.className="inputs";

    item.locations.forEach((loc,j)=>{
      const label=document.createElement("label");
      label.className="slot";

      const span=document.createElement("span");
      span.textContent=loc;

      const input=document.createElement("input");
      input.type="number";
      input.min="0";
      input.step="1";
      input.inputMode="numeric";
      input.placeholder="0";
      input.id=`item_${i}_${j}`;
      input.addEventListener("input",()=>{
        updateTotals();
        saveValues();
      });

      label.append(span,input);
      inputs.appendChild(label);
    });

    const total=document.createElement("div");
    total.className="total";
    total.innerHTML=`<span id="total_${i}">0</span><small>合計</small>`;

    row.append(name,inputs,total);
    inventory.appendChild(row);
  });

  const fridges=document.getElementById("fridges");
  fridges.innerHTML="";
  config.fridges.forEach((name,i)=>{
    const row=document.createElement("div");
    row.className="temp-row";
    row.innerHTML=`
      <div>${escapeHtml(name)}</div>
      <div class="temp-input">
        <input id="temp_${i}" type="number" step="0.1" placeholder="0">
        <span>°C</span>
      </div>`;
    fridges.appendChild(row);
    row.querySelector("input").addEventListener("input",saveValues);
  });

  loadValues();
  updateTotals();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function getItemValues(i){
  return config.items[i].locations.map((_,j)=>{
    const el=document.getElementById(`item_${i}_${j}`);
    return el?safeNum(el.value):0;
  });
}

function updateTotals(){
  config.items.forEach((item,i)=>{
    const el=document.getElementById(`total_${i}`);
    if(el) el.textContent=getItemValues(i).reduce((a,b)=>a+b,0);
  });
}

function saveValues(){
  const data={
    items:config.items.map((item,i)=>getItemValues(i)),
    temps:config.fridges.map((_,i)=>{
      const el=document.getElementById(`temp_${i}`);
      return el?el.value:"";
    })
  };
  localStorage.setItem(VALUES_KEY,JSON.stringify(data));
}

function loadValues(){
  try{
    const raw=localStorage.getItem(VALUES_KEY);
    if(!raw)return;
    const data=JSON.parse(raw);

    if(Array.isArray(data.items)){
      data.items.forEach((vals,i)=>{
        if(!config.items[i] || !Array.isArray(vals))return;
        vals.forEach((v,j)=>{
          const el=document.getElementById(`item_${i}_${j}`);
          if(el && v!==0 && v!=="") el.value=v;
        });
      });
    }

    if(Array.isArray(data.temps)){
      data.temps.forEach((v,i)=>{
        const el=document.getElementById(`temp_${i}`);
        if(el)el.value=v??"";
      });
    }
  }catch(e){}
}

function makeCopyText(){
  const lines=[];
  config.items.forEach((item,i)=>{
    const total=getItemValues(i).reduce((a,b)=>a+b,0);
    lines.push(`${item.name}：${total}`);
  });

  lines.push("");
  lines.push("冰箱溫度：");

  config.fridges.forEach((name,i)=>{
    const el=document.getElementById(`temp_${i}`);
    const v=el?el.value:"";
    lines.push(`${name}：${v===""?"":v+"°C"}`);
  });

  return lines.join("\n");
}

async function copyText(){
  const text=makeCopyText();
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  showMsg("已複製，可以直接貼到 LINE。");
}

function clearValues(){
  if(!confirm("確定要清除目前所有庫存數量與溫度嗎？"))return;
  localStorage.removeItem(VALUES_KEY);
  document.querySelectorAll('#inventory input[type="number"], #fridges input[type="number"]').forEach(el=>el.value="");
  updateTotals();
  showMsg("已清除目前數量與溫度。");
}

function showMsg(text){
  const el=document.getElementById("msg");
  el.textContent=text;
  clearTimeout(window._msg);
  window._msg=setTimeout(()=>el.textContent="",2600);
}

function buildConfigEditor(){
  document.getElementById("titleInput").value=config.title || "";

  const box=document.getElementById("configItems");
  box.innerHTML="";

  config.items.forEach((item,i)=>{
    const card=document.createElement("div");
    card.className="config-item";

    const top=document.createElement("div");
    top.className="config-top";

    const name=document.createElement("input");
    name.type="text";
    name.value=item.name;
    name.dataset.role="item-name";
    name.dataset.i=i;

    const del=document.createElement("button");
    del.className="danger small";
    del.textContent="刪除品項";
    del.onclick=()=>{
      readEditorIntoConfig();
      config.items.splice(i,1);
      buildConfigEditor();
    };

    top.append(name,del);

    const locList=document.createElement("div");
    locList.className="loc-list";

    item.locations.forEach((loc,j)=>{
      const row=document.createElement("div");
      row.className="loc-row";

      const input=document.createElement("input");
      input.type="text";
      input.value=loc;
      input.dataset.role="loc-name";
      input.dataset.i=i;
      input.dataset.j=j;
      input.placeholder="例如：小冰箱";

      const remove=document.createElement("button");
      remove.className="danger small";
      remove.textContent="刪除位置";
      remove.onclick=()=>{
        readEditorIntoConfig();
        if(config.items[i].locations.length<=1){
          alert("每個品項至少要保留一個位置。");
          return;
        }
        config.items[i].locations.splice(j,1);
        buildConfigEditor();
      };

      row.append(input,remove);
      locList.appendChild(row);
    });

    const addLoc=document.createElement("button");
    addLoc.className="success small";
    addLoc.style.marginTop="8px";
    addLoc.textContent="＋ 增加位置";
    addLoc.onclick=()=>{
      readEditorIntoConfig();
      const n=config.items[i].locations.length+1;
      config.items[i].locations.push("位置"+n);
      buildConfigEditor();
    };

    card.append(top,locList,addLoc);
    box.appendChild(card);
  });

  const fridgeBox=document.getElementById("fridgeConfig");
  fridgeBox.innerHTML="";
  config.fridges.forEach((name,i)=>{
    const row=document.createElement("div");
    row.className="fridge-config";

    const input=document.createElement("input");
    input.type="text";
    input.value=name;
    input.dataset.role="fridge-name";
    input.dataset.i=i;

    const del=document.createElement("button");
    del.className="danger small";
    del.textContent="刪除";
    del.onclick=()=>{
      readEditorIntoConfig();
      config.fridges.splice(i,1);
      buildConfigEditor();
    };

    row.append(input,del);
    fridgeBox.appendChild(row);
  });
}

function readEditorIntoConfig(){
  config.title=document.getElementById("titleInput").value.trim() || "庫存統計";

  document.querySelectorAll('[data-role="item-name"]').forEach(el=>{
    const i=Number(el.dataset.i);
    if(config.items[i]) config.items[i].name=el.value.trim() || `品項${i+1}`;
  });

  document.querySelectorAll('[data-role="loc-name"]').forEach(el=>{
    const i=Number(el.dataset.i), j=Number(el.dataset.j);
    if(config.items[i] && config.items[i].locations[j]!==undefined){
      config.items[i].locations[j]=el.value.trim() || `位置${j+1}`;
    }
  });

  document.querySelectorAll('[data-role="fridge-name"]').forEach(el=>{
    const i=Number(el.dataset.i);
    if(config.fridges[i]!==undefined) config.fridges[i]=el.value.trim() || `冰箱${i+1}`;
  });
}

function applyConfig(){
  saveValues();
  readEditorIntoConfig();
  saveConfigStorage();
  buildMain();
  buildConfigEditor();
  showMsg("設定已套用。");
}

function addItem(){
  readEditorIntoConfig();
  config.items.push({
    name:`新商品${config.items.length+1}`,
    locations:["位置1"]
  });
  buildConfigEditor();
}

function addFridge(){
  readEditorIntoConfig();
  config.fridges.push(`冰箱${config.fridges.length+1}`);
  buildConfigEditor();
}

function resetConfig(){
  if(!confirm("確定恢復預設品項與位置設定嗎？目前庫存數字也會清除。"))return;
  config=deepCopy(DEFAULT_CONFIG);
  localStorage.removeItem(CONFIG_KEY);
  localStorage.removeItem(VALUES_KEY);
  buildMain();
  buildConfigEditor();
  showMsg("已恢復預設設定。");
}

document.getElementById("copyBtn").addEventListener("click",copyText);
document.getElementById("clearValuesBtn").addEventListener("click",clearValues);
document.getElementById("saveConfigBtn").addEventListener("click",applyConfig);
document.getElementById("addItemBtn").addEventListener("click",addItem);
document.getElementById("addFridgeBtn").addEventListener("click",addFridge);
document.getElementById("resetConfigBtn").addEventListener("click",resetConfig);

buildMain();
buildConfigEditor();
</script>
</body>
</html>
